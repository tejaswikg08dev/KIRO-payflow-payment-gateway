name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'identity-service/**'
      - 'merchant-service/**'
      - 'payment-service/**'
      - 'api-gateway/**'
      - 'bank-simulator/**'
      - 'service-registry/**'
      - 'config-server/**'
      - 'common-lib/**'
      - 'pom.xml'
  pull_request:
    branches: [main]
    paths:
      - 'identity-service/**'
      - 'merchant-service/**'
      - 'payment-service/**'
      - 'api-gateway/**'
      - 'bank-simulator/**'
      - 'service-registry/**'
      - 'config-server/**'
      - 'common-lib/**'

env:
  JAVA_VERSION: '17'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ─── Build & Test ─────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: payflow_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build common-lib
        run: mvn -pl common-lib install -DskipTests -B

      - name: Compile all services
        run: mvn compile -pl service-registry,config-server,identity-service,merchant-service,payment-service,api-gateway,bank-simulator -am -B

      - name: Run unit tests
        run: mvn test -pl identity-service,merchant-service,payment-service,api-gateway -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payflow_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379

      - name: Run integration tests
        run: mvn verify -pl payment-service,identity-service,merchant-service -B -Dgroups=integration
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payflow_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_REDIS_HOST: localhost

      - name: Generate JaCoCo coverage report
        run: mvn jacoco:report -pl identity-service,merchant-service,payment-service -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/'

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/'

  # ─── Docker Build & Push ──────────────────────────────
  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        service:
          - service-registry
          - config-server
          - identity-service
          - merchant-service
          - payment-service
          - api-gateway
          - bank-simulator

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Security Scan ────────────────────────────────────
  security-scan:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service: [service-registry, config-server, identity-service, merchant-service, payment-service, api-gateway]

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
