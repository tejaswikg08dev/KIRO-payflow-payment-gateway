# Configuration for Payment Service

server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payflow?currentSchema=payment
    username: payflow
    password: payflow_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: payment
  flyway:
    enabled: true
    schemas: payment
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

# Payment Configuration
payment:
  order-expiry-minutes: 30           # Orders expire after 30 minutes
  auth-expiry-days: 7                # Authorizations expire after 7 days
  idempotency-key-ttl-hours: 24     # Idempotency keys stored for 24 hours

# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Resilience4j — Circuit breaker for routing-service calls
resilience4j:
  circuitbreaker:
    instances:
      routing-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      routing-service:
        max-attempts: 2
        wait-duration: 200ms
